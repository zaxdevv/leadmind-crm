name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      DEMO_LOGIN_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/leadmind.log 2>&1 &
      - run: npx wait-on http://localhost:3000
      - run: npm run test:e2e
      - name: Build container
        run: docker build --tag leadmind-ci .
      - name: Start container with a fresh database volume
        run: >-
          docker run --detach --name leadmind-ci
          --publish 3001:3000
          --mount type=volume,src=leadmind-ci-data,dst=/data
          --env AUTH_SECRET="$AUTH_SECRET"
          --env DEMO_LOGIN_ENABLED=true
          leadmind-ci
      - name: Verify unprivileged container and initialized database
        run: |
          npx wait-on http://localhost:3001/demo --timeout 60000
          test "$(docker exec leadmind-ci id -u)" = "1000"
          curl --fail http://localhost:3001/demo --output /dev/null
      - name: Container diagnostics
        if: failure()
        run: docker logs leadmind-ci || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
