services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/leadmind.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      INIT_DEMO_DATA: ${INIT_DEMO_DATA:-true}
      AUTH_SESSION_VERSION: ${AUTH_SESSION_VERSION:-1}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_SECRET: ${CRM_WEBHOOK_SECRET:-}
    volumes:
      - leadmind-data:/data
    restart: unless-stopped
volumes:
  leadmind-data:
